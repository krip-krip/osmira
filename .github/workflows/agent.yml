# Lint and test the OsmiraCam agent (Python). No Pi needed: fake Core, fake ptzview.
name: agent

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: osmiracam/agent
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Tests
        run: uv run pytest
