# Build the ptzview video engine, treating warnings as errors.
# Ubuntu ships stock FFmpeg (no "+rpt"): this checks that the code compiles
# cleanly, not that it works on the Pi.
name: build-player

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev \
            libdrm-dev libcairo2-dev libmicrohttpd-dev libsrt-gnutls-dev

      - name: Build ptzview (-Werror)
        working-directory: osmiracam/player
        # CFLAGS is passed through the environment (not "make CFLAGS=...") so
        # that the Makefile's "+=" still appends the pkg-config flags.
        env:
          CFLAGS: -O2 -g -Wall -Wextra -Werror
        run: make
