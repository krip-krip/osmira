[project]
name = "osmiracam-agent"
version = "0.1.0"
description = "OsmiraCam station agent: fetches its configuration from OsmiraCore and drives ptzview"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.16.2",
]

[project.scripts]
osmiracam-agent = "osmiracam_agent.__main__:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Same rules as osmiracore: E/F, import order, modern syntax, likely bugs, type hints.
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
