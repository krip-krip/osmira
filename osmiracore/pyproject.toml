[project]
name = "osmiracore"
version = "0.1.0"
description = "Osmira central server: configuration, rights, tally and UMD for OsmiraCam stations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, UP: modern syntax,
# B: likely bugs, ANN: type hints everywhere (CLAUDE.md convention).
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
